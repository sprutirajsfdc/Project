<template>
    <lightning-card title="Agent Activity Dashboard">

        <!-- ================= AGENT INFO HEADER ================= -->
        <template if:true={agent}>
            <div class="agent-header">

                <div class="agent-left">
                    <div class="avatar-wrapper">
                        <img src={agentImage} class="main-avatar" />
                        <span class="online-dot"></span>
                    </div>

                    <div class="agent-details">
                        <h1 class="agent-name-bold">{agent.Name}</h1>
                        <p class="role-text">
                            <lightning-icon icon-name="utility:user" size="xx-small"></lightning-icon>
                            {agent.Title}
                        </p>
                        <div class="contact-links">
                            <span>
                                <lightning-icon icon-name="utility:phone_portrait" size="xx-small"></lightning-icon>
                                {agent.MobilePhone}
                            </span>
                            <span class="email-text">
                                <lightning-icon icon-name="utility:email" size="xx-small"></lightning-icon>
                                {agent.Email}
                            </span>
                        </div>
                    </div>
                </div>

                <div class="slds-col slds-no-flex">
                    <lightning-button label="Go Back" onclick={goBack}></lightning-button>
                </div>

            </div>
        </template>

        <!-- ================= FILTER SECTION ================= -->
        <div class="filter-section">
            <lightning-input type="date" label="Start Date" onchange={handleStartDate}></lightning-input>
            <lightning-input type="date" label="End Date" onchange={handleEndDate}></lightning-input>
            <lightning-button variant="brand" label="Apply Filter" onclick={loadData}></lightning-button>
            <lightning-combobox 
                label="Quick Filter" 
                value={selectedFilter} 
                options={filterOptions} 
                onchange={handleQuickFilter}>
            </lightning-combobox>
        </div>

        <!-- ================= GRID SECTION ================= -->
        <div class="grid-section">

            <!-- TASK TABLE -->
            <div class="table-card">
                <h2 class="table-title">Tasks</h2>
                <template if:true={tasks.length}>
                    <table class="custom-table">
                        <thead>
                            <tr>
                                <th>Subject</th>
                                <th>Status</th>
                                <th>Priority</th>
                                <th>Due Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={tasks} for:item="task">
                                <tr key={task.Id}>
                                    <td>{task.Subject}</td>
                                    <td>{task.Status}</td>
                                    <td><span class={task.Priority}>{task.Priority}</span></td>
                                    <td>{task.ActivityDate}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <template if:false={tasks.length}>
                    <p class="no-data">No Tasks Found</p>
                </template>
            </div>

            <!-- EVENT TABLE -->
            <div class="table-card">
                <h2 class="table-title">Events</h2>
                <template if:true={events.length}>
                    <table class="custom-table">
                        <thead>
                            <tr>
                                <th>Subject</th>
                                <th>Date</th>
                                <th>Duration (Min)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={events} for:item="event">
                                <tr key={event.Id}>
                                    <td>{event.Subject}</td>
                                    <td>{event.ActivityDate}</td>
                                    <td>{event.DurationInMinutes}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <template if:false={events.length}>
                    <p class="no-data">No Events Found</p>
                </template>
            </div>

            <!-- INQUIRY TABLE -->
            <div class="table-card">
                <h2 class="table-title">Inquiries</h2>
                <template if:true={inquiries.length}>
                    <table class="custom-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Status</th>
                                <th>Sub Status</th>
                                <th>Client Name</th>
                                <th>Lead Source</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={inquiries} for:item="inq">
                                <tr key={inq.Id}>
                                    <td>
                                        <a href="javascript:void(0);" data-id={inq.Id} onclick={navigateToInquiry}>
                                            {inq.Name}
                                        </a>
                                    </td>
                                    <td>{inq.Status__c}</td>
                                    <td>{inq.Sub_Status__c}</td>
                                    <td>{inq.ContactName}</td>
                                    <td>{inq.Lead_Source__c}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <template if:false={inquiries.length}>
                    <p class="no-data">No Inquiries Found</p>
                </template>
            </div>

        </div>

        <!-- ================= CHARTS ================= -->
        <div class="chart-section">

            <div class="chart-card chart-bar-small">
                <h2 class="table-title">Inquiry by Lead Source</h2>
                <canvas class="leadSourceChart chart-small"></canvas>
            </div>

            <div class="chart-card">
                <h2 class="table-title">Inquiry by Status</h2>
                <canvas class="statusChart chart-small"></canvas>
            </div>

        </div>

    </lightning-card>
</template>
