<template>
    <div class="detail-wrapper">
        <!-- Show content only if agent exists -->
        <template if:true={agent.Id}>
            <div class="slds-p-around_large bg-white">

                <!-- Agent Info -->
                <div class="slds-grid slds-grid_vertical-align-center">
                    <div class="slds-media slds-no-space slds-grow">
                        <div class="slds-media__figure relative">
                            <img src={agent.AWS_Profile_Url__c} class="main-avatar" />
                            <div class="online-dot"></div>
                        </div>
                        <div class="slds-media__body">
                            <h1 class="agent-name-bold">{agent.Name}</h1>
                            <p class="role-text">
                                <lightning-icon icon-name="utility:case" size="xx-small"></lightning-icon> 
                                {agent.Title}
                            </p>
                            <div class="contact-links">
                                <span>
                                    <lightning-icon icon-name="utility:phone_portrait" size="xx-small"></lightning-icon> 
                                    {agent.MobilePhone}
                                </span>
                                <span class="slds-m-left_medium">
                                    <lightning-icon icon-name="utility:email" size="xx-small"></lightning-icon> 
                                    {agent.Email}
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="slds-col slds-no-flex">
                        <lightning-button label="Go Back" onclick={goBack} class="slds-m-right_small"></lightning-button>
                        <lightning-button label="Log Call" variant="brand" icon-name="utility:log_a_call" onclick={handleLogCallClick}></lightning-button>
                    </div>
                </div>

                <!-- Metrics Section -->
                <div class="slds-grid slds-gutters slds-m-top_large">
                    <div class="slds-col slds-size_1-of-3">
                        <div class="metric-box">
                            <p class="m-label">TOTAL PORTFOLIO VALUE</p>
                            <p class="m-value">{formattedTotalPropertyValue}</p>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <div class="metric-box">
                            <p class="m-label">ACTIVE LISTINGS</p>
                            <p class="m-value">{activeListingsCount}</p>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <div class="metric-box">
                            <p class="m-label">CLOSED DEALS (YTD)</p>
                            <p class="m-value">
                                {closedDealsCount}
                                <span class="up">Total: {formattedTotalClosedAmount}</span>
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Listings Section -->
                <div class="slds-m-top_large listing-container">

                    <!-- FILTER TABS -->
                    <div class="listing-header">
                            <span class={saleTabClass} onclick={showSale}>
                                FOR SALE
                            </span>

                            <span class={rentTabClass} onclick={showRent}>
                                FOR RENT
                            </span>
                        </div>

                    <!-- TABLE -->
                    <table class="slds-table slds-table_bordered custom-table">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th>PROPERTY</th>
                                <th>STATUS</th>
                                <th>TYPE</th>
                                <th>PRICE</th>
                                <th>LOCATION</th>
                            </tr>
                        </thead>

                        <tbody>
                            <!-- Show records -->
                            <template if:true={filteredListings.length}>
                                <template for:each={filteredListings} for:item="item">
                                    <tr key={item.Id}>
                                        <td>
                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                <div class="slds-m-right_small">
                                                    <template if:true={item.thumbnail}>
                                                        <img src={item.thumbnail} 
                                                            alt="Property Thumbnail" 
                                                            style="width: 50px; height: 35px; object-fit: cover; border-radius: 4px; border: 1px solid #e5e5e5;" />
                                                    </template>
                                                </div>
                                                <div>
                                                <div class="agent-name-bold" style="font-size: 0.875rem; color: #081f3e;">
                                                    {item.Name}
                                                </div>
                                               <div class="slds-text-color_weak" style="font-size: 0.75rem; line-height: 1.4;">
                                                <span class="slds-m-right_x-small">{item.Auto_Generated_broker_reference_ID__c}</span>
                                                <span class="slds-p-left_x-small" style="border-left: 1px solid #dddbda;">
                                                    Listed {item.daysAgo} days ago
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                        </td>
                              
                                        <td>
                                            <span class="badge">{item.Status__c}</span>
                                        </td>
                                        <td>{item.Listing_Type__c   }</td>
                                        <td class="price-blue">{item.formattedPrice}</td>
                                        <td>{item.Address__c}</td>
                                    </tr>
                                </template>
                            </template>

                            <!-- Show empty message -->
                            <template if:false={filteredListings.length}>
                                <tr>
                                    <td colspan="6" class="slds-text-align_center slds-p-around_medium">
                                        No records found.
                                    </td>
                                </tr>
                            </template>

                        </tbody>
                    </table>

                </div>
            </div>
        </template>

        <!-- Spinner while loading -->
        <template if:false={agent.Id}>
            <lightning-spinner variant="brand" size="medium"></lightning-spinner>
        </template>
    </div>
</template>
