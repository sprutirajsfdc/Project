<template>
    <template if:false={selectedAgentId}>
        <div class="container slds-p-around_large">
            <div class="header-section slds-m-bottom_large">
                <div class="slds-grid slds-grid_vertical-align-center">
                    <div class="slds-col">
                        <div class="slds-media slds-no-space slds-grow">
                            <div class="slds-media__figure">
                                <lightning-icon icon-name="standard:address_book" size="small"></lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <p class="slds-text-title_caps slds-line-height_reset">Directory</p>
                                <h1 class="slds-page-header__title slds-m-right_small slds-align-middle">Agent Directory</h1>
                                <p class="slds-text-body_small slds-text-color_weak">Manage, connect and view performance metrics for your service team.</p>
                            </div>
                        </div>
                    </div>
                    <div class="slds-col slds-no-flex">
                        <lightning-input 
                            type="search" 
                            variant="label-hidden" 
                            placeholder="Filter by name..." 
                            onchange={handleSearch} 
                            class="search-input">
                        </lightning-input>
                    </div>
                </div>
            </div>

            <lightning-layout multiple-rows="true" horizontal-align="center">
                <template for:each={displayedAgents} for:item="agent">
                    <lightning-layout-item key={agent.Id} size="12" small-device-size="6" medium-device-size="4" large-device-size="3" class="slds-p-around_small">
                        <div class="agent-card">
                            <div class="avatar-wrapper">
                                <img src={agent.AWS_Profile_Url__c} alt={agent.Name} class="profile-img"/>
                            </div>
                            <div class="card-content slds-text-align_center">
                                <h2 class="agent-name">{agent.Name}</h2>
                                <p class="agent-title">{agent.Title}</p>
                                <div class="contact-info slds-m-vertical_medium">
                                    <p><lightning-icon icon-name="utility:phone_portrait" size="xx-small" class="slds-m-right_xx-small icon-gray"></lightning-icon> {agent.MobilePhone}</p>
                                    <p><lightning-icon icon-name="utility:email" size="xx-small" class="slds-m-right_xx-small icon-gray"></lightning-icon> {agent.Email}</p>
                                </div>
                                <lightning-button 
                                    label="View Details" 
                                    variant="neutral" 
                                    class="view-details-btn"
                                    data-id={agent.Id}
                                    onclick={handleViewDetails}>
                                </lightning-button>
                            </div>
                        </div>
                    </lightning-layout-item>
                </template>
            </lightning-layout>

            <div class="pagination-bar slds-m-top_large slds-grid slds-grid_align-center slds-grid_vertical-align-center">
                <button class="nav-arrow" onclick={prevPage}>&#8249;</button>
                <template for:each={pages} for:item="pageNum">
                    <button key={pageNum.value} class={pageNum.className} onclick={goToPage} data-id={pageNum.value}>
                        {pageNum.value}
                    </button>
                </template>
                <button class="nav-arrow" onclick={nextPage}>&#8250;</button>
            </div>
        </div>
    </template>

    <template if:true={selectedAgentId}>
        <c-agent-detail-view 
            agent-id={selectedAgentId} 
            onback={handleBack}>
        </c-agent-detail-view>
    </template>
</template>
